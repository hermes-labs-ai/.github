name: Reusable Python package release

on:
  workflow_call:
    inputs:
      release-tag:
        description: V-prefixed tag to build and publish; must be the tag that triggered the run (pass github.ref_name).
        required: true
        type: string
      python-version:
        description: Python version used to build the distributions.
        required: false
        type: string
        default: "3.12"
      package-url:
        description: Public PyPI project URL shown on the protected environment.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the triggering release tag
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          TRIGGER_REF: ${{ github.ref }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error title=Release tag contract::release-tag '$RELEASE_TAG' is not a v-prefixed version tag."
            exit 1
          fi
          if [ "$TRIGGER_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error title=Release tag contract::run was triggered by '$TRIGGER_REF', not 'refs/tags/$RELEASE_TAG'. Call this workflow from the release tag push and pass github.ref_name as release-tag."
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fully qualified so a branch with the same name can never be checked out instead.
          ref: refs/tags/${{ inputs.release-tag }}
          persist-credentials: false

      - name: Verify exact release tag checkout
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          head_commit="$(git rev-parse HEAD)"
          tag_object="$(git rev-parse "refs/tags/$RELEASE_TAG")"
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          if [ "$head_commit" != "$tag_commit" ]; then
            echo "::error title=Release tag contract::checked out $head_commit, but $RELEASE_TAG points to $tag_commit."
            exit 1
          fi
          if [ "$TRIGGER_SHA" != "$tag_commit" ] && [ "$TRIGGER_SHA" != "$tag_object" ]; then
            echo "::error title=Release tag contract::$RELEASE_TAG now points to $tag_commit, but the run was triggered at $TRIGGER_SHA. The tag moved after the trigger; refusing to build."
            exit 1
          fi
          echo "Building $RELEASE_TAG at $head_commit."

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}

      - name: Build and validate distributions
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$RELEASE_TAG" = "v$package_version"
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*

      - name: Preserve validated distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pypi-${{ github.repository }}
      cancel-in-progress: false
    environment:
      name: pypi
      url: ${{ inputs.package-url }}
    permissions:
      id-token: write
    steps:
      - name: Retrieve validated distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
