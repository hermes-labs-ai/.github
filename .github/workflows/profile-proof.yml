name: Profile proof spine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Verify the deterministic profile contract
        run: |
          python scripts/check_profile.py
          python -m unittest discover -s tests
      - name: Compare with the live research index
        run: python scripts/check_profile.py --compare-site
