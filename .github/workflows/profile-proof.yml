name: Profile proof spine

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the deterministic profile contract
        run: |
          python scripts/check_profile.py
          python -m unittest discover -s tests
      - name: Compare with the live research index
        run: python scripts/check_profile.py --compare-site
